<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distraction History - GrindTime</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <button class="back-btn" id="backBtn">← Back</button>
      <h1 class="title">📊 Distraction History</h1>
      <button class="clear-btn" id="clearBtn">🗑️</button>
    </div>

    <!-- Summary Stats -->
    <div class="stats-summary">
      <div class="stat-card">
        <div class="stat-value" id="todayDistraction">0s</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="weekDistraction">0s</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalDistraction">0s</div>
        <div class="stat-label">All Time</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="avgDistraction">0s</div>
        <div class="stat-label">Average</div>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="today">Today</button>
      <button class="filter-btn" data-filter="week">This Week</button>
    </div>

    <!-- History List -->
    <div class="history-section">
      <div class="history-header">
        <h2>Recent Distractions</h2>
        <span class="history-count" id="historyCount">0 events</span>
      </div>
      
      <div class="history-list" id="historyList">
        <!-- Dynamically populated -->
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎯</div>
        <h3>Perfect Focus!</h3>
        <p>No distractions recorded yet. Keep up the great work!</p>
      </div>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
